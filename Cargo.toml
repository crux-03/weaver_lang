[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name = "weaver_lang"
authors = ["crux03"]
version = "0.8.1"
edition = "2024"
description = "A dynamic text evaluation language for procedural content generation"
license = "MIT"
repository = "https://github.com/crux-03/weaver_lang"
rust-version = "1.86.0" # MSRV for upcasting

[dependencies]
pest = "=2.8.6"
pest_derive = "=2.8.6"
thiserror = "1"
macros = { package = "weaver_macros", version = "0.3.0", path = "macros", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
macros = { package = "weaver_macros", version = "0.3.0", path = "macros" }
serde_json = "1"

[features]
default = ["macros"]
macros = ["dep:macros"]
# Weaver Template Notation: `#inputs` declarations and a document that is one
# value with holes rather than prose with holes. Gates the API, the AST and
# evaluation; the grammar itself is one file and is always compiled.
wtn = []
# Serialize signature metadata — for hosts that ship the registry's
# vocabulary to an editor frontend.
serde = ["dep:serde"]
